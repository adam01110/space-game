<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#27142b" />
    <title>Space Game</title>
    <link rel="stylesheet" href="./menu.css" />
    <link
      rel="preload"
      href="./space_game_client_bg.wasm"
      as="fetch"
      type="application/wasm"
      crossorigin
    />
  </head>
  <body>
    <div id="game-shell" data-game-ready="false" aria-hidden="true"></div>
    <main id="menu">
      <section class="menu-content" aria-labelledby="game-title">
        <h1 id="game-title"><span>Space</span><span>Game</span></h1>
        <button id="play" type="button">Play</button>
        <p id="status" role="status" aria-live="polite">Downloading game…</p>
      </section>
    </main>
    <script type="module" src="./menu.js"></script>
  </body>
</html>
