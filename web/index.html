<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>space-game</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw !important;
        height: 100vh !important;
        touch-action: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #ddd;
        font:
          1rem system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading…</div>
    <script type="module">
      import init from "./space_game_client.js";

      try {
        await init();
        document.querySelector("#loading")?.remove();
      } catch (error) {
        console.error(error);
        const loading = document.querySelector("#loading");
        if (loading) {
          loading.textContent = "Failed to start. Check the browser console.";
        }
      }
    </script>
  </body>
</html>
