[package]
name = "project-client"
version.workspace = true
edition.workspace = true
# Tests live in tests/ but are included as private modules of the binary, which needs access
# to crate-internal systems. Keeping autotests off stops cargo from also building them as
# separate integration test targets.
autotests = false

[lints]
workspace = true

[features]
default = []
browser-dev = []
dev = ["bevy/dynamic_linking", "avian2d/debug-plugin"]

[dependencies]
avian2d.workspace = true
bevy = { workspace = true, features = [
  # keep-sorted start
  "2d",
  "audio",
  "bevy_settings",
  "keyboard",
  "mouse",
  "ui",
  "web_asset_cache",
  # keep-sorted end
] }
bevy_resvg.workspace = true
crossbeam-channel = "0.5"
ehttp = "0.7.1"
lightyear = { workspace = true, features = [
  # keep-sorted start
  "avian2d",
  "client",
  "frame_interpolation",
  "input_native",
  "interpolation",
  "metrics",
  "netcode",
  "prediction",
  "replication",
  "std",
  "webtransport",
  # keep-sorted end
] }
log.workspace = true
project-game.workspace = true
project-protocol.workspace = true
serde_json = "1"
url = "2.5"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }

[target.'cfg(target_family = "wasm")'.dependencies]
bevy = { workspace = true, features = ["webgl2"] }
web-sys = { version = "0.3", features = ["Location", "Window"] }
