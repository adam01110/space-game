[package]
name = "project-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = []
dev = ["bevy/dynamic_linking"]

[dependencies]
avian2d.workspace = true
bevy = { workspace = true, features = ["multi_threaded"] }
governor = { version = "0.10.4", default-features = false, features = ["std"] }
lightyear = { workspace = true, features = [
  # keep-sorted start
  "avian2d",
  "input_native",
  "metrics",
  "netcode",
  "replication",
  "server",
  "std",
  "webtransport",
  "webtransport_self_signed", # Clients require an operator-provided certificate pin.
  # keep-sorted end
] }
log.workspace = true
project-game.workspace = true
project-protocol.workspace = true
serde_json = "1"
tii = { version = "0.0.8", features = ["extras"] }
