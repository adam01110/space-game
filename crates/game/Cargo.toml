[package]
name = "project-game"
version.workspace = true
edition.workspace = true

[features]
default = []
parallel = ["avian2d/parallel"]

[dependencies]
avian2d = { workspace = true, features = [
  # keep-sorted start
  "2d",
  "f32",
  "parry-f32",
  # keep-sorted end
] }
bevy.workspace = true
lightyear = { workspace = true, features = [
  "avian2d",
  "input_native",
  "prediction",
  "std",
] }
project-protocol.workspace = true

[dev-dependencies]
lightyear = { workspace = true, features = [
  "client",
  "frame_interpolation",
  "server",
] }
