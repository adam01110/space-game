[workspace]
default-members = ["crates/client"]
members = [
  # keep-sorted start
  "crates/client",
  "crates/game",
  "crates/protocol",
  "crates/server",
  # keep-sorted end
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Bevy system parameters must generally be passed by value.
needless_pass_by_value = "allow"

# Explicit scoped visibility is preferable here.
redundant_pub_crate = "allow"

# Fused floating-point operations can affect cross-platform simulation results.
suboptimal_flops = "allow"

# Prevent runtime panics.
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

# Prevent silently discarded work and errors.
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Prevent asynchronous and concurrency mistakes.
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"

# Bevy's Bundle derive emits mem::forget internally.
mem_forget = "allow"

# Unsafe and memory-related safeguards.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Numeric correctness.
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

# Miscellaneous correctness.
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Require intentional, documented lint suppression.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.dependencies]
avian2d = { version = "0.7.0", default-features = false, features = ["enhanced-determinism"] }
bevy = { version = "0.19.1", default-features = false }
bevy_resvg = "2.5.0"
lightyear = { version = "0.29.0", default-features = false }
log = { version = "0.4.34", features = [
  # keep-sorted start
  "max_level_debug",
  "release_max_level_warn",
  # keep-sorted end
] }
project-game = { path = "crates/game" }
project-protocol = { path = "crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# keep-sorted start
codegen-units = 1
lto = "fat"
# keep-sorted end

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# keep-sorted start
inherits = "release"
opt-level = "s"
strip = "debuginfo"
# keep-sorted end
