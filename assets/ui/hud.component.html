<div id="hud">
  <div id="hud-status">
    <p id="hud-fps">FPS: --</p>
    <p id="hud-ping">Ping: -- Ms</p>
  </div>
  <div id="hud-map">
    <div id="hud-map-ring">
      <div id="hud-map-range"></div>
      <div id="hud-map-axis-x"></div>
      <div id="hud-map-axis-y"></div>
    </div>
    <p id="hud-map-label">MAP</p>
  </div>
  <div id="hud-abilities">
    <div class="hud-ability">
      <p id="hud-boost" class="hud-ability-charge">100</p>
      <p class="hud-ability-key">[Space]</p>
      <p class="hud-ability-name">BOOST</p>
    </div>
    <div class="hud-ability">
      <p id="hud-blaster" class="hud-ability-charge">100</p>
      <p class="hud-ability-key">[LMB]</p>
      <p class="hud-ability-name">BLASTER</p>
    </div>
    <div class="hud-ability">
      <p id="hud-beam" class="hud-ability-charge">100</p>
      <p class="hud-ability-key">[RMB]</p>
      <p class="hud-ability-name">PHASE Beam</p>
    </div>
  </div>
  <div id="hud-health">
    <p id="hud-health-label">HULL</p>
    <div id="hud-health-track">
      <div id="hud-health-fill"></div>
    </div>
    <p id="hud-health-value">100</p>
  </div>
  <div id="hud-alert">
    <p id="hud-players">PLAYERS: 0</p>
    <p id="hud-bots">BOTS: 0</p>
  </div>
</div>
