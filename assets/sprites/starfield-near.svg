<!-- Nearer starfield tile. 256x256 pixels over 1024 world
     units, so one texel is one gameplay canvas pixel. Sparser and brighter than the distant
     layer, with stars that show a body instead of a point. Mirroring and quarter turns at chunk
     level keep the one tile from reading as a repeat. -->
